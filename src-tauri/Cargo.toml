[package]
name = "contributor-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The crate has a second binary (`dev_node`, a headless contributor for
# testing), so `cargo run` — which is what `tauri dev` invokes — needs telling
# which one is the app.
default-run = "contributor-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "contributor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["process", "fs", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tar = "0.4.46"
# Verifying the runtime artifacts before installing them.
sha2 = "0.10"

